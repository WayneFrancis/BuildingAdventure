name: Build and test

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build BuildingAdventure.sln --configuration Release
      - name: Run geometry tests
        run: dotnet run --project tests/BuildingAdventure.Tests --configuration Release --no-build
